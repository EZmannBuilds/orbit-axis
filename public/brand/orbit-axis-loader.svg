<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Orbit loading</title>
  <desc id="desc">The Pure Orbit mark with a point travelling around its circular path.</desc>
  <style>
    .orbit-loader__satellite {
      transform-box: view-box;
      transform-origin: 64px 64px;
      animation: orbit-loader-travel 1.4s linear infinite;
    }

    @keyframes orbit-loader-travel {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .orbit-loader__satellite { animation: none; }
    }
  </style>
  <g fill="none" stroke="#7657e8" stroke-linecap="round">
    <circle cx="64" cy="64" r="35" stroke-width="8"/>
    <path d="M37 115 91 13" stroke-width="7"/>
  </g>
  <circle cx="64" cy="64" r="7" fill="#f4f2fa" stroke="#080a12" stroke-width="2"/>
  <g class="orbit-loader__satellite">
    <circle cx="89" cy="40" r="8" fill="#b9a7ff"/>
  </g>
</svg>
