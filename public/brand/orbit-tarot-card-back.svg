    <g transform="translate(350 132)"><use href="#small-node"/></g>
    <g transform="translate(350 460)"><use href="#small-node"/></g>
    <g transform="translate(350 740)"><use href="#small-node"/></g>
    <g transform="translate(350 1068)"><use href="#small-node"/></g>
    <g transform="translate(350 1145)"><use href="#small-node"/></g>
    <g transform="translate(108 126)"><use href="#small-node"/></g>
    <g transform="translate(592 126)"><use href="#small-node"/></g>
    <g transform="translate(108 1074)"><use href="#small-node"/></g>
