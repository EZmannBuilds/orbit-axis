  <g transform="translate(55 600)"><use href="#large-node"/></g>
  <g transform="translate(645 600)"><use href="#large-node"/></g>

  <!-- Central observer medallion, eye, and stepped pyramid. -->
  <g>
    <circle cx="350" cy="600" r="88" fill="#080a12" stroke="#b9a7ff" stroke-width="4"/>
    <circle cx="350" cy="600" r="82" fill="none" stroke="#7657e8" stroke-width="1.2" opacity="0.75"/>
    <circle cx="350" cy="578" r="34" fill="none" stroke="#b9a7ff" stroke-width="0.85" opacity="0.72"/>
    <circle cx="350" cy="578" r="18" fill="none" stroke="#7657e8" stroke-width="0.8" opacity="0.72"/>
    <path d="M331 578Q350 562 369 578Q350 594 331 578Z" fill="#f4f2fa" stroke="#b9a7ff" stroke-width="0.8"/>
    <circle cx="350" cy="578" r="5.5" fill="#080a12" stroke="#7657e8" stroke-width="1.4"/>
    <circle cx="350" cy="578" r="1.8" fill="#b9a7ff"/>
    <path d="M350 592 314 651H386Z" fill="none" stroke="#b9a7ff" stroke-width="1.1"/>
