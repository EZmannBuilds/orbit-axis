<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1200" role="img" aria-labelledby="title desc">
  <title id="title">Orbit Axis Tarot card back</title>
  <desc id="desc">A deep-space celestial instrument with nested violet orbits, observer points, corner stars, and an eye above a stepped pyramid.</desc>
  <defs>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="62" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.96
        0 0 0 0 0.95
        0 0 0 0 1
        0 0 0 .14 0"/>
    </filter>

    <g id="small-node">
      <circle r="5.4" fill="#7657e8" stroke="#f4f2fa" stroke-width="1.1"/>
      <circle r="8.8" fill="none" stroke="#b9a7ff" stroke-width="0.7" opacity="0.55"/>
    </g>

    <g id="large-node">
      <circle r="17" fill="#7657e8" stroke="#b9a7ff" stroke-width="1.5"/>
      <circle r="24" fill="none" stroke="#f4f2fa" stroke-width="1" opacity="0.82"/>
      <circle r="30" fill="none" stroke="#7657e8" stroke-width="0.9" opacity="0.55"/>
    </g>

    <g id="corner-instrument">
      <circle r="23" fill="none" stroke="#b9a7ff" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.72"/>
      <circle r="13" fill="none" stroke="#7657e8" stroke-width="0.9" opacity="0.82"/>
      <path d="M0-18 3-5 13-3 4 2 0 18-3 5-13 3-4-2Z" fill="#f4f2fa" stroke="#b9a7ff" stroke-width="0.5"/>
      <path d="M0-31V-22M0 22V31M-31 0H-22M22 0H31" fill="none" stroke="#b9a7ff" stroke-width="1"/>
    </g>

    <line id="inner-ray" x1="350" y1="472" x2="350" y2="500" stroke="#b9a7ff" stroke-width="0.75" opacity="0.72"/>
    <line id="outer-tick" x1="350" y1="246" x2="350" y2="264" stroke="#b9a7ff" stroke-width="0.75" opacity="0.6"/>
    <line id="node-ray" x1="350" y1="269" x2="350" y2="216" stroke="#b9a7ff" stroke-width="0.75" opacity="0.72"/>

    <clipPath id="pyramid-clip">
      <path d="M350 590 314 651H386Z"/>
    </clipPath>
  </defs>

  <rect width="700" height="1200" fill="#080a12"/>
  <rect x="10" y="10" width="680" height="1180" fill="none" stroke="#b9a7ff" stroke-width="1.35"/>
  <rect x="16" y="16" width="668" height="1168" fill="none" stroke="#7657e8" stroke-width="0.8" opacity="0.9"/>
  <path d="M26 28H332M368 28H674M26 1172H332M368 1172H674" fill="none" stroke="#b9a7ff" stroke-width="0.55" opacity="0.35"/>

  <!-- Corner calibration marks. -->
  <g fill="none" stroke="#7657e8" stroke-width="1" opacity="0.72">
    <path d="M35 133H82M119 39V78M618 133H665M581 39V78"/>
    <path d="M35 1067H82M119 1122V1161M618 1067H665M581 1122V1161"/>
  </g>
  <g transform="translate(69 70)"><use href="#corner-instrument"/></g>
  <g transform="translate(631 70)"><use href="#corner-instrument"/></g>
  <g transform="translate(69 1130)"><use href="#corner-instrument"/></g>
  <g transform="translate(631 1130)"><use href="#corner-instrument"/></g>

