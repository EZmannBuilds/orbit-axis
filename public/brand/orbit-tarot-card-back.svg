    <use href="#outer-tick" transform="rotate(5 350 600)"/>
    <use href="#outer-tick" transform="rotate(10 350 600)"/>
    <use href="#outer-tick" transform="rotate(15 350 600)"/>
    <use href="#outer-tick" transform="rotate(20 350 600)"/>
    <use href="#outer-tick" transform="rotate(25 350 600)"/>
    <use href="#outer-tick" transform="rotate(30 350 600)"/>
    <use href="#outer-tick" transform="rotate(35 350 600)"/>
    <use href="#outer-tick" transform="rotate(40 350 600)"/>
    <use href="#outer-tick" transform="rotate(45 350 600)"/>
    <use href="#outer-tick" transform="rotate(50 350 600)"/>
