    <path d="M16 600H684" stroke="#b9a7ff" stroke-width="0.75" opacity="0.48"/>
    <ellipse cx="350" cy="600" rx="315" ry="548" stroke="#b9a7ff" stroke-width="0.8" stroke-dasharray="1 5" opacity="0.46"/>
    <ellipse cx="350" cy="600" rx="302" ry="522" stroke="#b9a7ff" stroke-width="1.05" opacity="0.73"/>
    <ellipse cx="350" cy="600" rx="286" ry="462" stroke="#7657e8" stroke-width="1.25" opacity="0.86"/>
    <ellipse cx="350" cy="600" rx="274" ry="445" stroke="#b9a7ff" stroke-width="0.7" stroke-dasharray="2 6" opacity="0.58"/>
    <ellipse cx="350" cy="600" rx="252" ry="365" stroke="#b9a7ff" stroke-width="0.7" opacity="0.52"/>
    <ellipse cx="350" cy="600" rx="230" ry="280" stroke="#7657e8" stroke-width="2.5" stroke-dasharray="0.1 9" opacity="0.95"/>
    <ellipse cx="350" cy="600" rx="195" ry="205" stroke="#b9a7ff" stroke-width="0.75" opacity="0.6"/>
    <ellipse cx="350" cy="600" rx="142" ry="155" stroke="#7657e8" stroke-width="0.8" stroke-dasharray="2 5" opacity="0.72"/>
  </g>

