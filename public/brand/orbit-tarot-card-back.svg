    <use href="#inner-ray" transform="rotate(300 350 600)"/>
    <use href="#inner-ray" transform="rotate(310 350 600)"/>
    <use href="#inner-ray" transform="rotate(320 350 600)"/>
    <use href="#inner-ray" transform="rotate(330 350 600)"/>
    <use href="#inner-ray" transform="rotate(340 350 600)"/>
    <use href="#inner-ray" transform="rotate(350 350 600)"/>
  </g>

  <!-- Top and bottom observer bursts. -->
  <g>
    <use href="#node-ray" transform="rotate(-60 350 270)"/>
    <use href="#node-ray" transform="rotate(-50 350 270)"/>
    <use href="#node-ray" transform="rotate(-40 350 270)"/>
    <use href="#node-ray" transform="rotate(-30 350 270)"/>
    <use href="#node-ray" transform="rotate(-20 350 270)"/>
    <use href="#node-ray" transform="rotate(-10 350 270)"/>
    <use href="#node-ray"/>
    <use href="#node-ray" transform="rotate(10 350 270)"/>
    <use href="#node-ray" transform="rotate(20 350 270)"/>
    <use href="#node-ray" transform="rotate(30 350 270)"/>
    <use href="#node-ray" transform="rotate(40 350 270)"/>
    <use href="#node-ray" transform="rotate(50 350 270)"/>
    <use href="#node-ray" transform="rotate(60 350 270)"/>
  </g>
  <g transform="rotate(180 350 600)">
    <use href="#node-ray" transform="rotate(-60 350 270)"/>
    <use href="#node-ray" transform="rotate(-50 350 270)"/>
    <use href="#node-ray" transform="rotate(-40 350 270)"/>
    <use href="#node-ray" transform="rotate(-30 350 270)"/>
    <use href="#node-ray" transform="rotate(-20 350 270)"/>
