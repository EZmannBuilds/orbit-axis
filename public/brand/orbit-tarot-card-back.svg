    <path d="M108 1074 350 740 592 1074" stroke="#7657e8" stroke-width="1.35" opacity="0.84"/>
    <path d="M108 126 350 460M592 126 350 460M108 1074 350 740M592 1074 350 740" stroke="#b9a7ff" stroke-width="0.75" stroke-dasharray="1 5" opacity="0.44"/>
    <path d="M136 170 350 462M564 170 350 462M136 1030 350 738M564 1030 350 738" stroke="#7657e8" stroke-width="0.65" stroke-dasharray="8 3 1 3" opacity="0.52"/>
