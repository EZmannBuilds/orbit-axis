    <use href="#inner-ray" transform="rotate(120 350 600)"/>
    <use href="#inner-ray" transform="rotate(130 350 600)"/>
    <use href="#inner-ray" transform="rotate(140 350 600)"/>
    <use href="#inner-ray" transform="rotate(150 350 600)"/>
    <use href="#inner-ray" transform="rotate(160 350 600)"/>
    <use href="#inner-ray" transform="rotate(170 350 600)"/>
    <use href="#inner-ray" transform="rotate(180 350 600)"/>
    <use href="#inner-ray" transform="rotate(190 350 600)"/>
    <use href="#inner-ray" transform="rotate(200 350 600)"/>
    <use href="#inner-ray" transform="rotate(210 350 600)"/>
    <use href="#inner-ray" transform="rotate(220 350 600)"/>
    <use href="#inner-ray" transform="rotate(230 350 600)"/>
    <use href="#inner-ray" transform="rotate(240 350 600)"/>
    <use href="#inner-ray" transform="rotate(250 350 600)"/>
