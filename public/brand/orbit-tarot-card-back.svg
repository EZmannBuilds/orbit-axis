    <use href="#node-ray" transform="rotate(30 350 270)"/>
    <use href="#node-ray" transform="rotate(40 350 270)"/>
    <use href="#node-ray" transform="rotate(50 350 270)"/>
    <use href="#node-ray" transform="rotate(60 350 270)"/>
