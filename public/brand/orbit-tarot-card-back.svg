    <use href="#outer-tick" transform="rotate(160 350 600)"/>
    <use href="#outer-tick" transform="rotate(165 350 600)"/>
    <use href="#outer-tick" transform="rotate(170 350 600)"/>
    <use href="#outer-tick" transform="rotate(175 350 600)"/>
    <use href="#outer-tick" transform="rotate(180 350 600)"/>
    <use href="#outer-tick" transform="rotate(185 350 600)"/>
    <use href="#outer-tick" transform="rotate(190 350 600)"/>
    <use href="#outer-tick" transform="rotate(195 350 600)"/>
    <use href="#outer-tick" transform="rotate(200 350 600)"/>
    <use href="#outer-tick" transform="rotate(205 350 600)"/>
    <use href="#outer-tick" transform="rotate(210 350 600)"/>
    <use href="#outer-tick" transform="rotate(215 350 600)"/>
    <use href="#outer-tick" transform="rotate(220 350 600)"/>
    <use href="#outer-tick" transform="rotate(225 350 600)"/>
    <use href="#outer-tick" transform="rotate(230 350 600)"/>
    <use href="#outer-tick" transform="rotate(235 350 600)"/>
    <use href="#outer-tick" transform="rotate(240 350 600)"/>
    <use href="#outer-tick" transform="rotate(245 350 600)"/>
    <use href="#outer-tick" transform="rotate(250 350 600)"/>
    <use href="#outer-tick" transform="rotate(255 350 600)"/>
    <use href="#outer-tick" transform="rotate(260 350 600)"/>
    <use href="#outer-tick" transform="rotate(265 350 600)"/>
    <use href="#outer-tick" transform="rotate(270 350 600)"/>
    <use href="#outer-tick" transform="rotate(275 350 600)"/>
    <use href="#outer-tick" transform="rotate(280 350 600)"/>
    <use href="#outer-tick" transform="rotate(285 350 600)"/>
    <use href="#outer-tick" transform="rotate(290 350 600)"/>
    <use href="#outer-tick" transform="rotate(295 350 600)"/>
    <use href="#outer-tick" transform="rotate(300 350 600)"/>
    <use href="#outer-tick" transform="rotate(305 350 600)"/>
    <use href="#outer-tick" transform="rotate(310 350 600)"/>
    <use href="#outer-tick" transform="rotate(315 350 600)"/>
    <use href="#outer-tick" transform="rotate(320 350 600)"/>
    <use href="#outer-tick" transform="rotate(325 350 600)"/>
    <use href="#outer-tick" transform="rotate(330 350 600)"/>
    <use href="#outer-tick" transform="rotate(335 350 600)"/>
